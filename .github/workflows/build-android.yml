name: Build Android (EAS local)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Baixar o código do repositório
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Configurar Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Configurar Android SDK
        uses: android-actions/setup-android@v3

      - name: Instalar dependências do projeto
        run: npm install

      - name: Instalar EAS CLI
        run: npm install -g eas-cli

      - name: Gerar o build do Android (local)
        run: eas build --platform android --profile preview --local --non-interactive --output ${{ github.workspace }}/app-release.apk
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}

      - name: Publicar o APK gerado
        uses: actions/upload-artifact@v4
        with:
          name: app-release-apk
          path: ${{ github.workspace }}/app-release.apk
