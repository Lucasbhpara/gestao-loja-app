<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Estação de Etiquetas · ULVA</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;600;700;800&family=IBM+Plex+Mono:wght@500;600;700&display=swap">
<style>
  :root{
    --bg:#f7f5f0; --surface:#ffffff; --fg:#1c1b19; --muted:#6b6558;
    --accent:#d9480f; --accent-ink:#ffffff; --success:#2f9e44; --success-ink:#ffffff;
    --border:#e5e0d5; --tile-shadow: 0 1px 2px rgba(28,27,25,.06), 0 8px 24px rgba(28,27,25,.08);
    --font-display:'Archivo',system-ui,sans-serif; --font-mono:'IBM Plex Mono',ui-monospace,monospace;
  }
  *{box-sizing:border-box}
  [hidden]{display:none !important;}
  html,body{margin:0; padding:0;}
  body{background:var(--bg); color:var(--fg); font-family:var(--font-display); padding:16px; min-height:100vh;}
  .wrap{max-width:640px; margin:0 auto; display:flex; flex-direction:column; gap:20px;}

  .topbar{display:flex; align-items:baseline; justify-content:space-between; gap:12px; flex-wrap:wrap;}
  .topbar h1{font-size:19px; font-weight:800; margin:0; letter-spacing:-.01em;}
  .count-pill{display:inline-flex; align-items:center; gap:6px; background:var(--surface); border:1px solid var(--border); border-radius:999px; padding:6px 12px; font-size:12.5px; font-weight:600; color:var(--muted);}
  .count-pill b{font-family:var(--font-mono); color:var(--fg); font-size:13px;}

  .scan-card{background:var(--surface); border:1px solid var(--border); border-radius:20px; padding:24px; box-shadow:var(--tile-shadow); display:flex; flex-direction:column; align-items:center; gap:14px; text-align:center;}
  .scan-label{font-size:11.5px; font-weight:700; text-transform:uppercase; letter-spacing:.08em; color:var(--muted);}
  .product-name{font-size:16px; font-weight:700; line-height:1.3; min-height:1.2em;}
  .price-tag{font-family:var(--font-mono); font-size:15px; font-weight:700; color:var(--success); background:#eaf7ee; border-radius:999px; padding:4px 12px;}

  .barcode-tile{background:#ffffff; border-radius:12px; padding:18px 14px 10px; width:100%; max-width:420px; display:flex; justify-content:center;}
  .barcode-tile svg{width:100%; height:auto; max-height:150px; display:block;}
  .code-digits{font-family:var(--font-mono); font-weight:700; font-size:clamp(20px,6vw,30px); letter-spacing:.04em; font-variant-numeric:tabular-nums;}
  .code-tipo{font-size:10.5px; font-weight:700; letter-spacing:.06em; text-transform:uppercase; color:var(--muted);}

  .confirm-btn{width:100%; max-width:420px; border:none; border-radius:14px; padding:16px 20px; font-family:var(--font-display); font-size:16px; font-weight:800; background:var(--success); color:var(--success-ink); cursor:pointer; transition:transform .1s ease, opacity .15s ease;}
  .confirm-btn:active{transform:scale(.98);}
  .confirm-btn:disabled{opacity:.5; cursor:default;}
  .skip-link{background:none; border:none; color:var(--muted); font-family:var(--font-display); font-size:12.5px; font-weight:600; text-decoration:underline; cursor:pointer; padding:4px;}

  .empty-state{display:flex; flex-direction:column; align-items:center; gap:8px; padding:36px 16px; color:var(--muted);}
  .empty-state .big{font-size:40px;}
  .empty-state p{margin:0; font-size:13.5px; max-width:260px;}

  .queue{display:flex; flex-direction:column; gap:8px;}
  .queue-title{font-size:11.5px; font-weight:700; text-transform:uppercase; letter-spacing:.07em; color:var(--muted); padding-inline:2px;}
  .queue-row{display:flex; align-items:center; justify-content:space-between; gap:10px; background:var(--surface); border:1px solid var(--border); border-radius:10px; padding:10px 14px;}
  .queue-row .code{font-family:var(--font-mono); font-weight:600; font-size:13px; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
  .queue-row .when{font-size:11px; color:var(--muted); flex-shrink:0;}

  .toast{position:fixed; left:50%; bottom:20px; transform:translateX(-50%) translateY(20px); background:var(--fg); color:var(--bg); font-size:13px; font-weight:600; padding:10px 18px; border-radius:999px; opacity:0; pointer-events:none; transition:opacity .2s ease, transform .2s ease;}
  .toast.show{opacity:1; transform:translateX(-50%) translateY(0);}

  .conn-dot{width:7px; height:7px; border-radius:50%; background:var(--muted); display:inline-block;}
  .conn-dot.ok{background:var(--success);}
  .conn-dot.err{background:var(--accent);}

  footer{text-align:center; font-size:11px; color:var(--muted); padding-top:8px;}
</style>
</head>
<body>

<div class="wrap">
  <div class="topbar">
    <h1>Estação de Etiquetas</h1>
    <span class="count-pill"><span class="conn-dot" id="connDot"></span> <b id="pendingCount">—</b> pendente(s)</span>
  </div>

  <div class="scan-card" id="scanCard">
    <div class="scan-label">Aponte o leitor pra este código</div>
    <div class="product-name" id="productName"></div>
    <div class="price-tag" id="priceTag" hidden></div>
    <div class="barcode-tile"><svg id="barcode"></svg></div>
    <div class="code-digits" id="codeDigits">—</div>
    <div class="code-tipo" id="codeTipo"></div>
    <button class="confirm-btn" id="confirmBtn">Bipei! Próximo código</button>
    <button class="skip-link" id="skipBtn">pular este por enquanto</button>
  </div>

  <div class="empty-state" id="emptyState" hidden>
    <div class="big">📭</div>
    <p>Nenhum código esperando agora. Assim que alguém bipar um produto no celular, ele aparece aqui.</p>
  </div>

  <div class="queue">
    <div class="queue-title">Na fila</div>
    <div id="queueList"></div>
  </div>

  <footer>by Lucas Alberto</footer>
</div>

<div class="toast" id="toast"></div>

<script>
(function(){
  var SUPABASE_URL = 'https://llstmcmgormolhbnszap.supabase.co';
  var SUPABASE_KEY = 'sb_publishable_Kk5u4REY7PUWKMpx9wlZnA_BXgfqrxF';
  var HEADERS = { apikey: SUPABASE_KEY, Authorization: 'Bearer ' + SUPABASE_KEY };

  // ================= Gerador de código de barras (100% local) =================
  // EAN-13 / EAN-8 / UPC-A para códigos padrão de indústria,
  // CODE128 para os códigos internos de pesáveis (ex.: 67195 = banana caturra).

  var L_CODE = ['0001101','0011001','0010011','0111101','0100011','0110001','0101111','0111011','0110111','0001011'];
  var G_CODE = ['0100111','0110011','0011011','0100001','0011101','0111001','0000101','0010001','0001001','0010111'];
  var R_CODE = ['1110010','1100110','1101100','1000010','1011100','1001110','1010000','1000100','1001000','1110100'];
  var PARITY = ['LLLLLL','LLGLGG','LLGGLG','LLGGGL','LGLLGG','LGGLLG','LGGGLL','LGLGLG','LGLGGL','LGGLGL'];

  // Tabela padrão do CODE128: 107 padrões (0-105 com 11 módulos, stop com 13)
  var C128 = ['212222','222122','222221','121223','121322','131222','122213','122312','132212','221213',
  '221312','231212','112232','122132','122231','113222','123122','123221','223211','221132',
  '221231','213212','223112','312131','311222','321122','321221','312212','322112','322211',
  '212123','212321','232121','111323','131123','131321','112313','132113','132311','211313',
  '231113','231311','112133','112331','132131','113123','113321','133121','313121','211331',
  '231131','213113','213311','213131','311123','311321','331121','312113','312311','332111',
  '314111','221411','431111','111224','111422','121124','121421','141122','141221','112214',
  '112412','122114','122411','142112','142211','241211','221114','413111','241112','134111',
  '111242','121142','121241','114212','124112','124211','411212','421112','421211','212141',
  '214121','412121','111143','111341','131141','114113','114311','411113','411311','113141',
  '114131','311141','411131','211412','211214','211232','2331112'];

  function ean13Bits(code){
    var parity = PARITY[+code[0]];
    var bits = '101';
    for (var i = 0; i < 6; i++){
      var d = +code[1 + i];
      bits += (parity[i] === 'L' ? L_CODE[d] : G_CODE[d]);
    }
    bits += '01010';
    for (var j = 0; j < 6; j++){ bits += R_CODE[+code[7 + j]]; }
    return bits + '101';
  }

  function ean8Bits(code){
    var bits = '101';
    for (var i = 0; i < 4; i++){ bits += L_CODE[+code[i]]; }
    bits += '01010';
    for (var j = 0; j < 4; j++){ bits += R_CODE[+code[4 + j]]; }
    return bits + '101';
  }

  // CODE128 conjunto B — aceita qualquer tamanho, inclusive códigos ímpares
  function code128Bits(texto){
    var valores = [104]; // Start B
    for (var i = 0; i < texto.length; i++){
      valores.push(texto.charCodeAt(i) - 32);
    }
    var soma = 104;
    for (var k = 1; k < valores.length; k++){ soma += valores[k] * k; }
    valores.push(soma % 103); // dígito verificador
    valores.push(106);        // Stop
    var bits = '';
    for (var v = 0; v < valores.length; v++){
      var padrao = C128[valores[v]];
      var barra = true;
      for (var p = 0; p < padrao.length; p++){
        var largura = +padrao[p];
        for (var w = 0; w < largura; w++){ bits += barra ? '1' : '0'; }
        barra = !barra;
      }
    }
    return bits;
  }

  function desenharBarras(svg, bits, alturaModulo){
    var ns = 'http://www.w3.org/2000/svg';
    var larguraModulo = 2.2;
    var altura = alturaModulo || 90;
    var larguraTotal = bits.length * larguraModulo;
    while (svg.firstChild) svg.removeChild(svg.firstChild);
    svg.setAttribute('viewBox', '0 0 ' + larguraTotal + ' ' + altura);
    svg.setAttribute('preserveAspectRatio', 'xMidYMid meet');
    var fundo = document.createElementNS(ns, 'rect');
    fundo.setAttribute('x', 0); fundo.setAttribute('y', 0);
    fundo.setAttribute('width', larguraTotal); fundo.setAttribute('height', altura);
    fundo.setAttribute('fill', '#ffffff');
    svg.appendChild(fundo);
    var x = 0;
    for (var i = 0; i < bits.length; i++){
      if (bits[i] === '1'){
        var r = document.createElementNS(ns, 'rect');
        r.setAttribute('x', x); r.setAttribute('y', 0);
        r.setAttribute('width', larguraModulo); r.setAttribute('height', altura);
        r.setAttribute('fill', '#000000');
        svg.appendChild(r);
      }
      x += larguraModulo;
    }
  }

  function renderBarcode(code){
    var svg = document.getElementById('barcode');
    while (svg.firstChild) svg.removeChild(svg.firstChild);
    var texto = String(code).trim();
    var digitos = texto.replace(/\D/g, '');
    var tipo = '';
    try {
      if (digitos.length === 13 && digitos === texto){
        desenharBarras(svg, ean13Bits(digitos)); tipo = 'EAN-13';
      } else if (digitos.length === 12 && digitos === texto){
        desenharBarras(svg, ean13Bits('0' + digitos)); tipo = 'UPC-A';
      } else if (digitos.length === 8 && digitos === texto){
        desenharBarras(svg, ean8Bits(digitos)); tipo = 'EAN-8';
      } else {
        desenharBarras(svg, code128Bits(texto)); tipo = 'CODE128';
      }
    } catch (e){
      while (svg.firstChild) svg.removeChild(svg.firstChild);
      tipo = '';
    }
    return tipo;
  }
  // =========================== fim do gerador ===========================

  var state = { items: [], skippedIds: [], busy: false };

  var el = {
    connDot: document.getElementById('connDot'),
    pendingCount: document.getElementById('pendingCount'),
    scanCard: document.getElementById('scanCard'),
    emptyState: document.getElementById('emptyState'),
    productName: document.getElementById('productName'),
    priceTag: document.getElementById('priceTag'),
    codeDigits: document.getElementById('codeDigits'),
    codeTipo: document.getElementById('codeTipo'),
    confirmBtn: document.getElementById('confirmBtn'),
    skipBtn: document.getElementById('skipBtn'),
    queueList: document.getElementById('queueList'),
    toast: document.getElementById('toast'),
  };

  function showToast(msg){
    el.toast.textContent = msg;
    el.toast.classList.add('show');
    setTimeout(function(){ el.toast.classList.remove('show'); }, 1800);
  }

  function formatarPreco(v){
    if (v === null || v === undefined || v === '') return null;
    var n = Number(v);
    if (isNaN(n)) return null;
    return 'R$ ' + n.toFixed(2).replace('.', ',');
  }

  function currentItem(){
    for (var i = 0; i < state.items.length; i++){
      if (state.skippedIds.indexOf(state.items[i].id) === -1) return state.items[i];
    }
    return null;
  }

  function render(){
    el.pendingCount.textContent = state.items.length;
    el.connDot.className = 'conn-dot ok';

    var item = currentItem();
    if (!item){
      el.scanCard.hidden = true;
      el.emptyState.hidden = false;
    } else {
      el.scanCard.hidden = false;
      el.emptyState.hidden = true;
      el.productName.textContent = item.product_name || '';
      var preco = formatarPreco(item.preco_venda);
      if (preco){
        el.priceTag.textContent = 'Preço atual: ' + preco;
        el.priceTag.hidden = false;
      } else {
        el.priceTag.hidden = true;
      }
      el.codeDigits.textContent = item.barcode;
      el.codeTipo.textContent = renderBarcode(item.barcode);
    }

    var rest = state.items.filter(function(i){ return !item || i.id !== item.id; }).slice(0, 5);
    el.queueList.innerHTML = '';
    rest.forEach(function(i){
      var row = document.createElement('div');
      row.className = 'queue-row';
      var t = new Date(i.created_at);
      var span1 = document.createElement('span');
      span1.className = 'code';
      span1.textContent = i.barcode + (i.product_name ? ' · ' + i.product_name : '');
      var span2 = document.createElement('span');
      span2.className = 'when';
      span2.textContent = t.toLocaleTimeString('pt-BR', {hour:'2-digit',minute:'2-digit'});
      row.appendChild(span1); row.appendChild(span2);
      el.queueList.appendChild(row);
    });
  }

  function fetchPending(){
    var url = SUPABASE_URL + '/rest/v1/barcode_collection?select=id,barcode,status,product_name,preco_venda,created_at,priority&status=eq.pending&order=priority.desc,created_at.asc&limit=30';
    fetch(url, { headers: HEADERS })
      .then(function(r){ if (!r.ok) throw new Error('http ' + r.status); return r.json(); })
      .then(function(data){
        var ids = data.map(function(d){ return d.id; });
        state.skippedIds = state.skippedIds.filter(function(id){ return ids.indexOf(id) !== -1; });
        state.items = data;
        render();
      })
      .catch(function(){
        el.connDot.className = 'conn-dot err';
      });
  }

  function markDone(){
    var item = currentItem();
    if (!item || state.busy) return;
    state.busy = true;
    el.confirmBtn.disabled = true;
    el.confirmBtn.textContent = 'Confirmando…';

    fetch(SUPABASE_URL + '/rest/v1/barcode_collection?id=eq.' + item.id, {
      method: 'PATCH',
      headers: Object.assign({ 'Content-Type': 'application/json', Prefer: 'return=minimal' }, HEADERS),
      body: JSON.stringify({ status: 'completed', completed_at: new Date().toISOString() })
    })
    .then(function(r){
      if (!r.ok) throw new Error('http ' + r.status);
      showToast('Código ' + item.barcode + ' concluído');
      state.items = state.items.filter(function(i){ return i.id !== item.id; });
      render();
    })
    .catch(function(){
      showToast('Não consegui confirmar, tenta de novo');
    })
    .finally(function(){
      state.busy = false;
      el.confirmBtn.disabled = false;
      el.confirmBtn.textContent = 'Bipei! Próximo código';
    });
  }

  function skipCurrent(){
    var item = currentItem();
    if (!item) return;
    state.skippedIds.push(item.id);
    render();
  }

  el.confirmBtn.addEventListener('click', markDone);
  el.skipBtn.addEventListener('click', skipCurrent);

  fetchPending();
  setInterval(fetchPending, 2500);
})();
</script>
</body>
</html>
