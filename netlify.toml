[build]
  # O "&& cp portal-admin.html dist/portal-admin.html" é pra publicar o
  # Portal Admin junto (fica em /portal-admin.html) — sem isso, o Netlify só
  # publicava o app, e o portal só ficava atualizado no GitHub Pages.
  command = "npx expo export -p web && cp portal-admin.html dist/portal-admin.html"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"

# Como o app não usa links tipo "/produto/123" (a navegação é toda por
# estado dentro da mesma tela), não precisa de redirecionamento especial
# pra rotas — o index.html sozinho já resolve tudo.
